version: '3.8'

services:
  ecosorter-mysql:
    image: mariadb:10.11
    container_name: ecosorter-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: eco_sorter
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ecosorter-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  ecosorter-backend:
    image: yangshengzhou/ecosorter:backend-v1
    container_name: ecosorter-backend
    restart: always
    ports:
      - "8081:8081"
    networks:
      - ecosorter-network
    depends_on:
      ecosorter-mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai

  trashcan-backend:
    image: yangshengzhou/ecosorter:trashcan-backend-v1
    container_name: trashcan-backend
    restart: always
    ports:
      - "9000:9000"
    networks:
      - ecosorter-network
    depends_on:
      ecosorter-mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      DB_HOST: ecosorter-mysql
      DB_USERNAME: root
      DB_PASSWORD: 123456
      DB_NAME: eco_sorter
    volumes:
      - trashcan_uploads:/app/uploads

  ecosorter-frontend:
    image: yangshengzhou/ecosorter:frontend-v1
    container_name: ecosorter-frontend
    restart: always
    ports:
      - "80:80"
    networks:
      - ecosorter-network
    depends_on:
      - ecosorter-backend
      - trashcan-backend

  trashcan-frontend:
    image: yangshengzhou/ecosorter:trashcan-frontend-v1
    container_name: trashcan-frontend
    restart: always
    ports:
      - "8080:80"
    networks:
      - ecosorter-network
    depends_on:
      - ecosorter-backend
      - trashcan-backend

networks:
  ecosorter-network:
    driver: bridge

volumes:
  mysql_data:
  trashcan_uploads:
